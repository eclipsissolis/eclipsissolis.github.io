<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои смены</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1a; --muted:#77776f; --line:#e4e4de; --accent:#2f6fed;
          --утро:#fff1cc; --утро-t:#7a5b00; --вечер:#e4e9ff; --вечер-t:#2b3f9e; --ночь:#e8e0f5; --ночь-t:#4a2f80; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --text:#ecece6; --muted:#8d8d84; --line:#333330; --accent:#5b8cff;
            --утро:#3d3213; --утро-t:#f0cf70; --вечер:#232b4d; --вечер-t:#a9b9ff; --ночь:#2f2545; --ночь-t:#cdb6f2; --err:#ff7a6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:26px 12px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #drop.has { border-style:solid; color:var(--text); }
  #preview { max-width:100%; max-height:180px; border-radius:8px; margin-top:10px; display:none; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input[type=text] { width:100%; padding:11px 12px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { width:100%; margin-top:16px; padding:12px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); margin-top:12px; padding:9px; font-size:14px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #out { margin-top:20px; }
  .err { color:var(--err); } .hint { color:var(--muted); font-size:14px; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:0; }
  .date { font-weight:700; min-width:76px; } .date small { color:var(--muted); font-weight:500; margin-left:4px; }
  .badge { font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .where { color:var(--muted); font-size:14px; margin-left:auto; text-align:right; }
  .privacy { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Мои смены</h1>
  <p class="sub">Загрузи скриншот расписания, напиши имя — получишь список смен.</p>

  <div class="card">
    <div id="drop" tabindex="0" role="button">Нажми, перетащи или вставь (Ctrl/⌘+V) скриншот<img id="preview" alt="Загруженный скриншот"></div>
    <input id="file" type="file" accept="image/*" hidden>

    <label for="name">Имя как в расписании</label>
    <input id="name" type="text" placeholder="Например: Юсуп" autocomplete="off">

    <button id="go">Найти мои смены</button>
    <div id="out" aria-live="polite"></div>
  </div>
  <p class="privacy">Всё считается прямо в браузере: скриншот никуда не отправляется.</p>
</main>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
